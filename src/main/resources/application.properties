spring.application.name=coopr8

# Bind to the port the host assigns (Render/Heroku set $PORT); default 8080 locally.
server.port=${PORT:8080}

# --- Shutdown and probes (container deployment) --------------------------------
# Graceful shutdown: on SIGTERM, stop accepting new requests, let in-flight ones
# finish, then exit. Without it a deploy or a scale-down severs live requests --
# and a severed request here can be a member's payment or a loan approval, mid
# transaction. The Dockerfile's ENTRYPOINT execs the JVM so it is PID 1 and
# actually receives the signal.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_GRACE_PERIOD:20s}

# Split /actuator/health into liveness and readiness. Both are already permitAll in
# AppConfig ("/actuator/health", "/actuator/health/**"); nothing else is exposed.
#   liveness  -- is this JVM working? The container HEALTHCHECK polls this, so a
#                database outage does not trigger a pointless restart loop.
#   readiness -- should this instance receive traffic? Includes the datasource, so
#                an instance whose database is unreachable is taken out of rotation.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Never expose stack traces, component detail or build internals to an unauthenticated
# caller: /actuator/health is public, so its body must stay a bare status word.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Load secrets from the project-root .env file (optional so CI/prod can inject
# real environment variables instead). See .env.example for the required keys.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
frontend.url=${FRONTEND_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Gemini vision (hardcopy form scanning). Optional so the app still boots without
# it; the scan feature returns a clear "not configured" error when the key is blank.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}

# Form photos from phone cameras run several MB; the Spring defaults (1MB/10MB)
# would reject them. Raise the multipart ceiling.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

paystack.secret.key=${PAYSTACK_SECRET_KEY}

# --- Payment provider settlement split ----------------------------------------
# What Paystack's `percentage_charge` is set to when COOPR8 creates a cooperative's
# settlement subaccount. It decides how each members' payment is divided between the
# platform and the cooperative, so there is DELIBERATELY NO DEFAULT: an unset value
# refuses to create the subaccount rather than routing money by accident. Confirm the
# intended number, and which side of the split Paystack's field names, before the
# first cooperative is onboarded in production.
coopr8.payments.paystack.platform-percentage-charge=${PAYSTACK_PLATFORM_PERCENTAGE_CHARGE:}

# --- Access-token signing (COOPR8 Phase 2) ------------------------------------
# The signing key was a committed literal in JwtConstant until Phase 2. It is now
# supplied by the environment and has been ROTATED: JwtProvider hashes the
# configured value at startup and refuses to boot if it is the retired key, so a
# deployment cannot quietly keep using the one that is public in git history.
# No default is provided on purpose -- a built-in fallback would mean every
# deployment shared a publicly known key. Generate one with:
#     openssl rand -base64 32
# Because the key changed and the token format gained required claims, EVERY token
# issued before this deployment is invalid. Members sign in again; there is no
# compatibility path, by design.
coopr8.jwt.secret=${JWT_SECRET}
coopr8.jwt.expiration-ms=${JWT_EXPIRATION_MS:10800000}

# --- Tenant isolation: Hibernate @Filter safety net ---------------------------
# SECONDARY defence only. Tenant isolation is enforced primarily by explicitly
# scoped repository queries (findByIdAndOrganizationId, findAllByOrganizationId,
# ...); the filter catches a query that forgets. Switching this off must NOT make
# the application leak across tenants -- TenantFilterDisabledIsolationTest proves
# that by re-running the cross-tenant checks with it disabled.
coopr8.tenant.hibernate-filter.enabled=${TENANT_HIBERNATE_FILTER_ENABLED:true}

# Which organization an UNAUTHENTICATED self-service signup joins, by slug.
# Tenant identity is otherwise always derived from the authenticated user; this covers
# the one flow that has no authenticated user yet. Left blank, a single-organization
# deployment resolves unambiguously and a multi-organization one refuses the signup
# rather than guessing. Phase 2 replaces this with real per-request tenant resolution.
coopr8.onboarding.organization-slug=${ONBOARDING_ORGANIZATION_SLUG:}

# Flyway owns the schema and is its single source of truth (COOPR8 Phase 1).
# The canonical COOPR8 database is a FRESH / EMPTY PostgreSQL instance: on first
# boot Flyway finds no flyway_schema_history and an empty schema, so it runs
# V1__initial_coopr8_schema.sql to build the entire COOPR8 schema from scratch
# (organizations + the six tenant-owned tables + otp, with all indexes/FKs/uniques).
# No baseline is configured -- baselining exists only to ADOPT a pre-existing schema,
# which is explicitly NOT how the fresh COOPR8 DB is provisioned. The historical
# Citadel database is a separate, later, controlled IMPORT source -- never the schema
# origin and never this app's migration target.
# Forward-only and additive: nothing here drops, resets, or truncates data.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Flyway is authoritative for DDL, so Hibernate only VALIDATES the mapping against
# the Flyway-created schema at boot (it never mutates the schema). V1 was authored to
# match the JPA entities' exact physical column names/JDBC types, so validate passes.
spring.jpa.hibernate.ddl-auto=validate

# --- Open Session In View: OFF, and matching the test profile ------------------
# Spring Boot defaults this to TRUE, which held a Hibernate session open for the
# whole request and let a lazy association be initialised from inside a controller
# or a serializer -- long after the transaction that loaded it had committed.
#
# The test profile has always set it to false, so the entire integration suite has
# only ever run with it off. Production ran with it on. That asymmetry is not
# theoretical: it is exactly what let the defect fixed in "Read the paying member's
# cooperative from the token, not from a lazy proxy" reach production while every
# test stayed green.
#
# For a multi-tenant application the risk is specifically a tenant risk. A lazy
# `organization` proxy resolved outside its transaction is a tenant identity read
# from whatever session happens to still be attached, rather than from the request's
# own verified context -- and the Hibernate tenant @Filter is bound per session, so
# a proxy initialised late may be filtered by nothing at all.
#
# With this false, such an access fails loudly with LazyInitializationException
# instead of silently returning data. Every entity graph a response needs must be
# fetched inside its transaction, which is what the services already do.
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.enable=true

# SSL option
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true

# Fail fast instead of hanging if Gmail's SMTP is unreachable/slow (values in ms).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
