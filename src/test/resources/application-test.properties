# =============================================================================
# COOPR8 "test" profile
# =============================================================================
# This profile is the ONLY configuration integration tests run under, and it
# exists to make one guarantee: a test can never reach a real database.
#
# THREE INDEPENDENT LAYERS enforce that:
#
#   1. The datasource values below are deliberately UNUSABLE (TCP port 1). If
#      anything ever bypasses the layers beneath, the connection fails instead
#      of succeeding against something real.
#   2. TestDatabase#registerDatasource contributes the throwaway Testcontainers
#      PostgreSQL URL through @DynamicPropertySource, which has the HIGHEST
#      precedence of any property source in a Spring test context -- above this
#      file and above the `.env` file that application.properties imports.
#   3. TestDatasourceGuard is an ApplicationContextInitializer that runs after
#      the dynamic properties are contributed and BEFORE any bean (so before
#      Flyway and before the connection pool). It refuses to let the context
#      start unless the resolved spring.datasource.url is byte-for-byte the URL
#      of the container this JVM started.
#
# Layer 3 is the load-bearing one: it does not care where a rogue value came
# from, only that it is not the container. See TestDatasourceGuard.
#
# NOTE ON H2: H2 is deliberately NOT used. The tenant-isolation schema depends
# on PostgreSQL partial unique indexes and expression indexes
# (e.g. UNIQUE (organization_id, LOWER(email))); an H2-green suite would prove
# nothing about the constraints that actually protect tenants in production.
# =============================================================================

# --- Layer 1: unusable placeholders (see above) -------------------------------
# Port 1 is reserved and unbindable, so these can never open a connection.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/coopr8_test_replaced_by_testcontainers
spring.datasource.username=coopr8-test-placeholder
spring.datasource.password=coopr8-test-placeholder
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Schema management: identical to production --------------------------------
# The container starts EMPTY, so Flyway runs the real migrations from scratch
# (V1 -> V2 -> ...) and Hibernate then validates the entity mapping against the
# Flyway-built schema. Tests therefore exercise the same DDL production uses.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Config the application requires at boot, with test-only values -----------
# application.properties declares these as ${ENV_VAR} with no default, so the
# context would not start without them. None of these services is contacted by
# any test: mail goes through a recording test double (see RecordingEmailService)
# and Cloudinary/Paystack/Gemini are never invoked.
frontend.url=http://localhost:3000
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
paystack.secret.key=test-paystack-secret
gemini.api-key=

# Test-only JWT signing key (32 bytes of 'A' Base64-encoded). Never a real key.
# The integration base class also pins this via @DynamicPropertySource so it
# holds even if a local .env file outranks this file.
coopr8.jwt.secret=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
coopr8.jwt.expiration-ms=3600000

# Tenant resolution must FAIL CLOSED in tests: no onboarding fallback slug, so a
# test that forgets to supply an organization gets an error, not a silent guess.
coopr8.onboarding.organization-slug=

# The Hibernate tenant @Filter is a SECONDARY safety net. It defaults to ON here,
# and the isolation tests re-run key checks with it switched OFF to prove the
# architecture stays secure without it.
coopr8.tenant.hibernate-filter.enabled=true

# --- Keep the test JVM quiet and self-contained --------------------------------
# Any accidental direct JavaMailSender use fails instantly instead of dialling
# Gmail. EmailService itself is replaced by a recording double.
spring.mail.host=localhost
spring.mail.port=1
spring.mail.username=test@localhost
spring.mail.password=test
spring.mail.properties.mail.smtp.connectiontimeout=250
spring.mail.properties.mail.smtp.timeout=250
spring.mail.properties.mail.smtp.writetimeout=250

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.flywaydb=INFO
